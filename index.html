<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b23d68">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<title>Links of Rechts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400&family=Lexend:wght@400;500;600&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one calm phone-width column with a bottom tab bar; full-screen
   step-by-step layers for the welcome and for each practice round. */
:root {
  --bg: #fbf0f3;
  --surface: #ffffff;
  --ink: #2b1d24;
  --muted: #7a6470;
  --line: #f0d8e0;
  --accent: #b23d68;
  --accent-ink: #ffffff;
  --accent-soft: #fbe2ea;
  --stage: #f8e9ee;
  --sil: #4a3540;
  --left: #4a68a8;
  --right: #b8761a;
  --left-soft: #e6ecf8;
  --right-soft: #f9ecd8;
  --good: #2f7a4e;
  --focus: #b23d68;
  --f-display: 'Lexend', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --f-data: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1318; --surface: #281a21; --ink: #f5e9ee; --muted: #c1a7b3; --line: #3e2a33;
    --accent: #f08db0; --accent-ink: #2a0e1a; --accent-soft: #3e2130; --stage: #2e1f26;
    --sil: #ecd6df; --left: #9bb5e8; --right: #e9b66c; --left-soft: #222a3d; --right-soft: #3a2b17;
    --good: #84c79d; --focus: #f08db0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1318; --surface: #281a21; --ink: #f5e9ee; --muted: #c1a7b3; --line: #3e2a33;
  --accent: #f08db0; --accent-ink: #2a0e1a; --accent-soft: #3e2130; --stage: #2e1f26;
  --sil: #ecd6df; --left: #9bb5e8; --right: #e9b66c; --left-soft: #222a3d; --right-soft: #3a2b17;
  --good: #84c79d; --focus: #f08db0; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(110px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 500; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.6rem; line-height: 1.2; }
h2 { font-size: 1.2rem; line-height: 1.3; }
h3 { font-size: 1.02rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 0.9rem; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-display); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.center { text-align: center; }

/* header */
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.mark { display: inline-grid; grid-template-columns: 1fr 1fr; width: 42px; height: 34px; border-radius: 10px; overflow: hidden; font-family: var(--f-display); font-size: 0.85rem; font-weight: 600; flex: none; }
.mark span { display: grid; place-items: center; color: var(--surface); }
.mark span:first-child { background: var(--left); }
.mark span:last-child { background: var(--right); }

/* bottom tab bar */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
.nav .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.nav button { border: 0; background: transparent; border-radius: 12px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: var(--f-display); font-size: 0.85rem; color: var(--muted); }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }

.stack { display: flex; flex-direction: column; gap: 18px; }
.group { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel.hero { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.note { background: var(--accent-soft); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }

/* next-round card */
.next { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; }
.pv { width: 96px; height: 96px; max-width: 100%; border-radius: 16px; background: var(--stage); display: block; object-fit: cover; }
.next .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 16px; font-family: var(--f-display); font-size: 1rem; min-height: 48px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.big { width: 100%; padding: 18px; font-size: 1.15rem; border-radius: 16px; min-height: 60px; }
.btn.quiet { background: transparent; border-color: transparent; text-decoration: underline; text-underline-offset: 3px; }
.btn.danger { color: var(--right); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.block { width: 100%; }

/* levels */
.levels { display: flex; flex-direction: column; gap: 8px; }
.level { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; text-align: left; width: 100%; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.level img { width: 56px; height: 56px; max-width: 100%; border-radius: 10px; background: var(--stage); display: block; }
.level .tx { display: flex; flex-direction: column; min-width: 0; }
.level .nm { font-family: var(--f-display); font-weight: 500; }
.level .ds { font-size: 0.88rem; color: var(--muted); }
.level[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.chip { display: inline-block; background: transparent; font-size: 0.78rem; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; font-family: var(--f-display); }
.chip.ready { border-color: var(--good); color: var(--good); }
button.chip { min-height: 34px; padding: 4px 12px; font-size: 0.85rem; }

/* fields */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-size: 0.92rem; color: var(--muted); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; background: var(--bg); flex-wrap: wrap; }
.seg button { flex: 1 1 auto; border: 0; background: transparent; border-radius: 9px; padding: 10px; min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 0 0 1px var(--line); font-weight: 700; }
select, input[type="text"], input[type="datetime-local"], textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0; min-height: 48px; }
textarea { min-height: 100px; font-family: var(--f-data); font-size: 0.8rem; }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); width: max-content; }
.stepper button { border: 0; background: transparent; width: 52px; height: 48px; font-size: 1.3rem; }
.stepper output { min-width: 3ch; text-align: center; font-family: var(--f-display); font-size: 1.1rem; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.switch { position: relative; width: 52px; height: 32px; flex: none; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--accent-ink); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 400px) { .grid2.stackable { grid-template-columns: 1fr; } }
details > summary { cursor: pointer; font-family: var(--f-display); list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 32px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "+"; font-size: 1.4rem; color: var(--muted); line-height: 1; }
details[open] > summary::after { content: "–"; }
.list { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; }
.numlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; counter-reset: n; }
.numlist li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; counter-increment: n; }
.numlist li::before { content: counter(n); width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--f-display); font-weight: 600; }

/* left/right comparison */
.cmp { display: flex; flex-direction: column; gap: 12px; }
.bar { display: grid; grid-template-columns: 1fr; gap: 4px; }
.bar .lab { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.bar .lab b { font-family: var(--f-display); font-weight: 500; }
.bar .track { height: 16px; border-radius: 8px; background: var(--bg); overflow: hidden; }
.bar .fill { height: 100%; border-radius: 8px; }
.bar.L .fill { background: var(--left); } .bar.R .fill { background: var(--right); }
.bar .val { font-family: var(--f-display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.verdict { font-size: 1.05rem; padding: 12px 14px; border-radius: 12px; background: var(--bg); }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; }
.dot.L { background: var(--left); } .dot.R { background: var(--right); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.88rem; color: var(--muted); }
.bignum { font-family: var(--f-display); font-size: 2.2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
canvas.chart { width: 100%; display: block; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 400; color: var(--muted); font-size: 0.82rem; }
td.r, th.r { text-align: right; }
.crit { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.crit li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start; }
.crit .ok { color: var(--good); font-weight: 700; }
.crit .no { color: var(--muted); }
.slist { display: flex; flex-direction: column; }
.slist .it { display: flex; flex-direction: column; gap: 2px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.slist .it:last-child { border-bottom: 0; }

/* photos */
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.thumb { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--stage); padding: 0; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.mir img { transform: scaleX(-1); }
.thumb .lab { position: absolute; left: 4px; bottom: 4px; font-size: 0.72rem; background: var(--surface); color: var(--ink); border-radius: 6px; padding: 1px 6px; font-family: var(--f-display); }
.thumb .lab.L { box-shadow: inset 3px 0 0 var(--left); } .thumb .lab.R { box-shadow: inset 3px 0 0 var(--right); }

/* sheet + toast */
.sheet { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 40%, transparent); display: flex; align-items: flex-end; justify-content: center; z-index: 40; }
.sheet .inner { background: var(--surface); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: 92%; overflow: auto; }
.sheet .big-pv { width: 170px; height: 170px; max-width: 100%; border-radius: 14px; object-fit: cover; align-self: center; background: var(--stage); }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; z-index: 60; max-width: calc(100% - 32px); }

/* full-screen layers (welcome + round) */
.layer { position: fixed; inset: 0; background: var(--bg); z-index: 30; display: flex; flex-direction: column; padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.layer .head { max-width: 560px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.layer .headrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 48px; }
.layer .body { flex: 1; min-height: 0; overflow: auto; max-width: 560px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; padding-block: 18px; }
.layer .body.mid { justify-content: center; }
.layer .foot { max-width: 560px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.steps { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; }
.steps li { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.steps li.done { background: var(--accent); opacity: .5; }
.steps li.on { background: var(--accent); }
.examples { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ex { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.ex canvas { width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 16px; background: var(--stage); display: block; }
.ex .tag { text-align: center; font-family: var(--f-display); font-size: 1.05rem; padding: 6px; border-radius: 10px; }
.ex.L .tag { background: var(--left-soft); color: var(--left); }
.ex.R .tag { background: var(--right-soft); color: var(--right); }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice button { min-height: 110px; border-radius: 18px; border: 2px solid var(--line); background: var(--surface); font-family: var(--f-display); font-size: 1.2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.choice button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

/* practice */
.progress { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); transition: width .2s; }
.stageWrap { position: relative; width: min(100%, 56vh, 500px); aspect-ratio: 1; max-width: 100%; margin: 0 auto; }
.stage { width: 100%; height: 100%; border-radius: 22px; background: var(--stage); display: block; touch-action: manipulation; }
.fix { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--muted); opacity: .5; pointer-events: none; }
.count { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 4.5rem; color: var(--accent); pointer-events: none; }
.fb { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-family: var(--f-display); font-size: 1rem; padding: 4px 12px; border-radius: 99px; background: var(--surface); pointer-events: none; }
.fb.ok { color: var(--good); } .fb.no { color: var(--muted); }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.answers button { min-height: 88px; border-radius: 18px; border: 2px solid var(--line); font-family: var(--f-display); font-size: 1.3rem; display: flex; align-items: center; justify-content: center; gap: 10px; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.answers button[data-ans="L"] { background: var(--left-soft); border-color: var(--left); color: var(--ink); }
.answers button[data-ans="R"] { background: var(--right-soft); border-color: var(--right); color: var(--ink); }
.answers button:active { filter: brightness(0.94); }
.pain { display: flex; flex-direction: column; gap: 10px; }
.pain .val { font-family: var(--f-display); font-size: 3rem; text-align: center; line-height: 1; }
.pain .scale { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; }
.pain .scale button { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0; font-family: var(--f-display); }
.pain .scale button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pain .ends { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); }
@media (max-width: 360px) { .pain .scale { grid-template-columns: repeat(6, 1fr); } }
@media (prefers-reduced-motion: reduce) { .switch::after, .progress > div { transition: none; } }

/* daily goal */
.today { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dots { display: inline-flex; gap: 6px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); display: inline-block; }
.dots i.on { background: var(--accent); }

</style>
</head>

<div class="app">

<script>
/* Procedural 3D models built from signed distance functions and meshed with
   surface nets. Coordinate frame (three.js, right-handed, y up):
   x: medial (-) / lateral (+)   (big toe / thumb at -x)
   y: down (-) / up (+)          (sole / palm at -y)
   z: back (-) / front (+)       (heel / wrist at -z, toes / fingers at +z)
   In a right-handed frame, a limb facing +z with its medial side at -x is a
   LEFT limb, so every original here is LEFT (BASE_SIDE). The RIGHT version is
   always made by mirroring x, never modelled separately, so labels can't drift. */
const LRModels = (() => {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sqrt = Math.sqrt;
  function smin(a, b, k) { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; }
  function smax(a, b, k) { return -smin(-a, -b, k); }
  function ell(x, y, z, cx, cy, cz, rx, ry, rz) {
    const px = (x - cx) / rx, py = (y - cy) / ry, pz = (z - cz) / rz;
    const k0 = sqrt(px * px + py * py + pz * pz);
    const k1 = sqrt(px * px / (rx * rx) + py * py / (ry * ry) + pz * pz / (rz * rz)) || 1e-6;
    return k0 * (k0 - 1) / k1;
  }
  function ell2(x, z, cx, cz, rx, rz) {
    const px = (x - cx) / rx, pz = (z - cz) / rz;
    const k0 = sqrt(px * px + pz * pz);
    const k1 = sqrt(px * px / (rx * rx) + pz * pz / (rz * rz)) || 1e-6;
    return k0 * (k0 - 1) / k1;
  }
  function sph(x, y, z, cx, cy, cz, r) { const dx = x - cx, dy = y - cy, dz = z - cz; return sqrt(dx * dx + dy * dy + dz * dz) - r; }
  function cap(x, y, z, a, b, ra, rb) {
    const bx = b[0] - a[0], by = b[1] - a[1], bz = b[2] - a[2];
    const px = x - a[0], py = y - a[1], pz = z - a[2];
    const h = clamp((px * bx + py * by + pz * bz) / (bx * bx + by * by + bz * bz), 0, 1);
    const qx = px - bx * h, qy = py - by * h, qz = pz - bz * h;
    return sqrt(qx * qx + qy * qy + qz * qz) - (ra + (rb - ra) * h);
  }
  function rbox(x, y, z, cx, cy, cz, hx, hy, hz, r) {

    [[-0.10, 0.025, 0.42], [-0.105, 0.0, 1.18], 0.09, 0.072],
    [[0.10, 0.02, 0.40], [0.13, 0.0, 1.11], 0.085, 0.068],
    [[0.285, 0.01, 0.35], [0.37, -0.01, 0.88], 0.075, 0.06],
  ];

    [[-0.30, -0.03, -0.12], [-0.58, -0.06, 0.20], 0.125, 0.1],
    [[-0.58, -0.06, 0.20], [-0.73, -0.04, 0.50], 0.1, 0.082],

    let d = rbox(x, y, z, 0, -0.005, 0.0, 0.40, 0.115, 0.44, 0.1);
    d = smin(d, ell(x, y, z, 0.0, 0.03, 0.39, 0.42, 0.115, 0.13), 0.08);       // knuckles

  // ---------- meshing (naive surface nets) ----------

    foot: { sdf: foot, bmin: [-0.62, -0.08, -1.2], bmax: [0.6, 1.02, 1.16], kind: 'foot' },
    sock: { sdf: sock, bmin: [-0.64, -0.1, -1.22], bmax: [0.62, 1.02, 1.18], kind: 'foot' },
    shoe: { sdf: shoe, bmin: [-0.5, -0.06, -1.22], bmax: [0.45, 0.9, 1.12], kind: 'foot' },
    hand: { sdf: hand, bmin: [-0.92, -0.36, -1.3], bmax: [0.62, 0.32, 1.32], kind: 'hand' },

  function build(name, res, painter) {
    const s = SPECS[name];

    const p = m.positions, n = m.normals;
    for (let q = 0; q < p.length; q += 3) {
      const c = painter(p[q], p[q + 1], p[q + 2], n[q], n[q + 1], n[q + 2], s.kind);
      col[q] = c[0]; col[q + 1] = c[1]; col[q + 2] = c[2];

  }

  function fromData(d, palette) {

})();

  const meta = new WeakMap();

  const KEY = norm([-1.1, 1.4, 3.0]), FILL = norm([1.2, -0.6, 2.5]);

    for (let i = 0; i < p.length; i += 3) for (let k = 0; k < 3; k++) { if (p[i + k] < mn[k]) mn[k] = p[i + k]; if (p[i + k] > mx[k]) mx[k] = p[i + k]; }

    let rad = 0;
    for (let i = 0; i < p.length; i += 3) rad = Math.max(rad, Math.hypot(p[i] - c[0], p[i + 1] - c[1], p[i + 2] - c[2]));

  }

        const sh = 0.36 + 0.16 * (0.5 + 0.5 * fn[1]) + 0.62 * Math.max(0, fn[0] * KEY[0] + fn[1] * KEY[1] + fn[2] * KEY[2]) + 0.2 * Math.max(0, fn[0] * FILL[0] + fn[1] * FILL[1] + fn[2] * FILL[2]);
        fr = Math.min(1, C[a * 3] * sh); fg = Math.min(1, C[a * 3 + 1] * sh); fb = Math.min(1, C[a * 3 + 2] * sh);
      } else if (o.mode === 'sil') { fr = sil[0]; fg = sil[1]; fb = sil[2]; }
      const minX = Math.max(0, Math.floor(Math.min(ax, bx, dx))), maxX = Math.min(S - 1, Math.ceil(Math.max(ax, bx, dx)));
      const minY = Math.max(0, Math.floor(Math.min(ay, by, dy))), maxY = Math.min(S - 1, Math.ceil(Math.max(ay, by, dy)));
      const inv = 1 / area;
      for (let py = minY; py <= maxY; py++) {
        const qy = py + 0.5;
        for (let px = minX; px <= maxX; px++) {
          const qx = px + 0.5;
          const w0 = ((dx - bx) * (qy - by) - (dy - by) * (qx - bx)) * inv;
          if (w0 < 0) continue;
          const w1 = ((ax - dx) * (qy - dy) - (ay - dy) * (qx - dx)) * inv;
          if (w1 < 0) continue;
          const w2 = 1 - w0 - w1;
          if (w2 < 0) continue;
          const depth = w0 * iz[a] + w1 * iz[b] + w2 * iz[d];
          const k = py * S + px;

          zb[k] = depth;

            data[q + 2] = (w0 * Bc[a] + w1 * Bc[b] + w2 * Bc[d]) * 255;
          } else { data[q] = fr * 255; data[q + 1] = fg * 255; data[q + 2] = fb * 255; }

/* =============================================================== storage */
const DB = { ok: false, db: null, ls: false };
const state = { sessions: [], photos: [] };
function dbOpen() {
  return new Promise((res) => {
    try {
      const rq = indexedDB.open('lrt', 1);
      rq.onupgradeneeded = () => { const d = rq.result; for (const s of ['sessions', 'photos', 'flares']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); };
      rq.onsuccess = () => { DB.db = rq.result; DB.ok = true; res(); };
      rq.onerror = () => res(); rq.onblocked = () => res();
      setTimeout(res, 2500);
    } catch (e) { res(); }
  });
}
function dbAll(store) {
  return new Promise((res) => {
    if (!DB.ok) return res(null);
    try { const rq = DB.db.transaction(store).objectStore(store).getAll(); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => res(null); } catch (e) { res(null); }
  });
}
// Rounds are small, so a second copy always goes to localStorage too (photos stay in IndexedDB only).
function lsSave() { try { localStorage.setItem('lrt.fallback', JSON.stringify({ sessions: state.sessions })); DB.ls = true; } catch (e) { DB.ls = false; } }
function persist(store, obj) { if (DB.ok) { try { DB.db.transaction(store, 'readwrite').objectStore(store).put(obj); } catch (e) { /* ignore */ } } if (store === 'sessions') lsSave(); }
function unpersist(store, id) { if (DB.ok) { try { DB.db.transaction(store, 'readwrite').objectStore(store).delete(id); } catch (e) { /* ignore */ } } if (store === 'sessions') lsSave(); }
function upsert(store, obj) { const a = state[store]; const i = a.findIndex((x) => x.id === obj.id); if (i >= 0) a[i] = obj; else a.push(obj); persist(store, obj); }
function remove(store, id) { state[store] = state[store].filter((x) => x.id !== id); unpersist(store, id); }
function wipeAll() { for (const s of ['sessions', 'photos']) { state[s] = []; if (DB.ok) try { DB.db.transaction(s, 'readwrite').objectStore(s).clear(); } catch (e) { /* ignore */ } } lsSave(); }

const imgCache = new Map();
function loadImg(p) {

/* ================================================================= stats */
const okRT = (x) => x.ok && x.rt >= 300 && x.rt <= 10000;

// right minus left: positive = right slower, negative = left slower
function gapOf(st) { if (st.L.med == null || st.R.med == null) return null; return st.R.med - st.L.med; }
const num = (v, d) => v.toLocaleString(S.lang, { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtS = (ms) => (ms == null ? '–' : num(ms / 1000, 2) + ' s');
const fmtP = (p) => (p == null ? '–' : Math.round(p) + '%');
const fmtDate = (ts) => new Date(ts).toLocaleDateString(S.lang, { day: 'numeric', month: 'short' });
const fmtDT = (ts) => new Date(ts).toLocaleString(S.lang, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
// Norms (NOI / GMI handbook): 80%+ correct, about 2 s for hands and feet, left and right
// about equal, and stable for at least a week. Checks pool all rounds of the past days at the
// current step, because one short round has only ~5 pictures per side and is too noisy.
const ANG = ['easy', 'mid', 'all'];
const LADDER = LEVELS.filter((l) => l.id !== 'photo').flatMap((l) => ANG.map((an) => ({ level: l.id, angles: an })));
const stepKey = (lv, an) => lv + '|' + an;
const sessAng = (s) => (s.cfg && s.cfg.angles) || 'easy';
const stepIndex = (lv, an) => LADDER.findIndex((x) => x.level === lv && x.angles === an);
const stepName = (lv, an) => t('lv_' + lv) + (lv === 'photo' ? '' : ' · ' + t('ang_n_' + an));
const sessionsAtStep = (key) => state.sessions.filter((s) => s.trials.length >= 5 && stepKey(s.level, sessAng(s)) === key).sort((a, b) => a.start - b.start);
const sessionsAt = (lv) => state.sessions.filter((s) => s.level === lv && s.trials.length >= 5).sort((a, b) => a.start - b.start);
function pool(lv, an, days) {
  const since = Date.now() - days * 864e5;

}
function stepCheck(lv, an) {

  const acc = st.L.acc != null && st.R.acc != null && st.L.acc >= 80 && st.R.acc >= 80;
  const rt = st.L.med != null && st.R.med != null && st.L.med <= 2000 && st.R.med <= 2000;
  const gp = st.L.med != null && st.R.med != null ? Math.abs(st.L.med - st.R.med) / Math.min(st.L.med, st.R.med) : null;

function drawCharts() {

function chart(cv, pts, series, o) {
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 300, H = 200;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + 'px';
  const c = cv.getContext('2d'); c.scale(dpr, dpr);
  const pad = { l: 58, r: 14, t: 12, b: 26 };
  const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
  const y = (v) => pad.t + ph - ((v - o.min) / (o.max - o.min)) * ph;
  const n = pts.length;
  const x = (i) => (n === 1 ? pad.l + pw / 2 : pad.l + (i / (n - 1)) * pw);
  const muted = cssVar('--muted'), line = cssVar('--line'), ink = cssVar('--ink');
  c.font = '12px "Atkinson Hyperlegible", system-ui, sans-serif'; c.textBaseline = 'middle';
  for (let v = o.min; v <= o.max + 1e-6; v += o.step) {
    c.strokeStyle = line; c.lineWidth = 1; c.beginPath(); c.moveTo(pad.l, Math.round(y(v)) + 0.5); c.lineTo(W - pad.r, Math.round(y(v)) + 0.5); c.stroke();
    c.fillStyle = muted; c.textAlign = 'right'; c.fillText(o.fmt(v), pad.l - 8, y(v));
  }
  c.setLineDash([5, 4]); c.strokeStyle = ink; c.globalAlpha = 0.55; c.lineWidth = 1.3; c.beginPath(); c.moveTo(pad.l, y(o.target)); c.lineTo(W - pad.r, y(o.target)); c.stroke(); c.setLineDash([]); c.globalAlpha = 1;
  if (o.targetLabel) { c.fillStyle = muted; c.textAlign = 'right'; c.textBaseline = 'bottom'; c.fillText(o.targetLabel, W - pad.r, y(o.target) - 3); c.textBaseline = 'middle'; }
  for (const s of series) {
    c.strokeStyle = s.col; c.fillStyle = s.col; c.lineWidth = s.w;
    c.beginPath(); let started = false;
    pts.forEach((p, i) => { const v = s.get(p.st); if (v == null) return; const yy = y(clamp(v, o.min, o.max)); if (!started) { c.moveTo(x(i), yy); started = true; } else c.lineTo(x(i), yy); });
    c.stroke();
    pts.forEach((p, i) => { const v = s.get(p.st); if (v == null) return; c.beginPath(); c.arc(x(i), y(clamp(v, o.min, o.max)), i === n - 1 ? 5 : 3, 0, Math.PI * 2); c.fill(); });
  }
  c.fillStyle = muted; c.textBaseline = 'alphabetic';
  c.textAlign = n === 1 ? 'center' : 'left'; c.fillText(fmtDate(pts[0].ts), n === 1 ? x(0) : pad.l, H - 6);
  if (n > 1) { c.textAlign = 'right'; c.fillText(fmtDate(pts[n - 1].ts), W - pad.r, H - 6); }
}

const SES = { on: false };
// Every picture of a left gets a mirror-image twin of a right (same view, same rotation),
// so both sides get exactly equally hard pictures and the left/right difference is fair.
// Views and 60° rotation steps follow the research stimuli (dorsum, sole, sides; 0-300°).
const VIEW_DIRS = { top: [0, 1, 0.12], bottom: [0, -1, 0.12], inner: [-1, 0.3, 0.05], outer: [1, 0.3, 0.05] };
const POSES = {
  easy: { views: ['top', 'bottom'], rots: [0, 60, -60] },
  mid: { views: ['top', 'bottom'], rots: [0, 60, 120, 180, -120, -60] },
  all: { views: ['top', 'bottom', 'inner', 'outer'], rots: [0, 60, 120, 180, -120, -60] },

const PHOTO_ROTS = { easy: [0], mid: [0, 90, 180, -90], all: [0, 45, 90, 135, 180, -135, -90, -45] };
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function jitter(d, deg) {
  const r = (deg * Math.PI) / 180, v = [d[0] + (Math.random() * 2 - 1) * r, d[1] + (Math.random() * 2 - 1) * r, d[2] + (Math.random() * 2 - 1) * r];
  const l = Math.hypot(...v); return v.map((x) => x / l);
}
function buildPlan(n, lv, ang) {
  const pairs = [];
  const pool = lv.id === 'photo' ? photoPool() : null;
  const combos = lv.id === 'photo' ? null : POSES[ang].views.flatMap((v) => POSES[ang].rots.map((r) => [v, r]));
  let bag = [];
  for (let k = 0; k < n / 2; k++) {
    if (lv.id === 'photo') {
      const p = pool[k % pool.length], r = pick(PHOTO_ROTS[ang]);
      pairs.push([{ side: 'L', photo: p, rot: r, mirror: p.side !== 'L' }, { side: 'R', photo: p, rot: -r, mirror: p.side !== 'R' }]);
    } else {
      if (!bag.length) bag = combos.slice().sort(() => Math.random() - 0.5); // cycle through all view/rotation combinations
      const [view, rot] = bag.pop();
      const d = jitter(VIEW_DIRS[view], 8), roll = ((rot + (Math.random() * 12 - 6)) * Math.PI) / 180;
      pairs.push([{ side: 'L', dir: d, roll, rot }, { side: 'R', dir: [-d[0], d[1], d[2]], roll: -roll, rot }]);
    }
  }
  const items = pairs.flatMap((p, k) => p.map((x) => Object.assign(x, { pair: k })));
  for (let tries = 0; tries < 500; tries++) {
    for (let i = items.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [items[i], items[j]] = [items[j], items[i]]; }
    let run = 1, ok = true;
    for (let i = 1; i < items.length && ok; i++) {
      run = items[i].side === items[i - 1].side ? run + 1 : 1;
      if (run > 3 || items[i].pair === items[i - 1].pair) ok = false;   // max 3 same side; twins never back to back
    }
    if (ok) break;
  }
  return items;
}

      <p>${esc(t('how_p'))}</p><ul class="list"><li>${esc(t('how_rule1'))}</li><li>${esc(t('how_rule2'))}</li></ul></div>
      <div class="foot"><button type="button" class="btn primary big" data-act="begin" id="beginBtn">${esc(t('how_go'))}</button></div>`;
    setTimeout(() => { try { exampleInto($('#exL'), SES.level.id, 'L'); exampleInto($('#exR'), SES.level.id, 'R'); } catch (e) { /* preview only */ } }, 0);
  } else if (p === 'go') goPhase();
  else if (p === 'done') donePhase();
}
async function goPhase() {
  const btn = $('#beginBtn'); if (btn) { btn.disabled = true; btn.textContent = t('building'); }
  await wait(20);
  if (SES.level.id === 'photo') await Promise.all(photoPool().map((p) => loadImg(p).catch(() => null)));
  else for (const sd of ['L', 'R']) getMesh(SES.level.model, SES.level.style, sd);
  await prepare(0);
  if (!SES.on) return;
  SES.phase = 'go';
  $('#ses').innerHTML = `${head('go', `<button type="button" class="btn" data-act="stop">${esc(t('stop'))}</button>`)}
    <div class="body mid"><div class="stageWrap"><canvas class="stage" id="stage"></canvas><div class="fix" id="fix" hidden></div><div class="count" id="count"></div><div class="fb" id="fb" hidden></div></div></div>
    <div class="foot"><div class="answers"><button type="button" data-ans="L"><span aria-hidden="true">←</span>${esc(t('left'))}</button><button type="button" data-ans="R">${esc(t('right'))}<span aria-hidden="true">→</span></button></div></div>`;
  const st = $('#stage');
  SES.fit = () => { const r = st.getBoundingClientRect(), d = window.devicePixelRatio || 1; st.width = Math.round(r.width * d); st.height = Math.round(r.height * d); };
  SES.fit();
  st.addEventListener('pointerdown', (e) => { if (!S.halves) return; const r = st.getBoundingClientRect(); answer(e.clientX - r.left < r.width / 2 ? 'L' : 'R', e.timeStamp); });
  for (const b of $$('[data-ans]')) b.addEventListener('pointerdown', (e) => { e.preventDefault(); answer(b.dataset.ans, e.timeStamp); });
  const cd = $('#count');
  for (const k of ['3', '2', '1']) { if (!SES.on || SES.phase !== 'go') return; cd.textContent = k; await wait(650); }
  if (!SES.on || SES.phase !== 'go') return;
  cd.textContent = '';
  nextTrial();
}
async function prepare(i) {
  if (i >= SES.plan.length || SES.specs[i]) return;
  const it = SES.plan[i], side = it.side, buf = SES.bufs[i % 2], lv = SES.level;
  let spec;
  if (lv.id === 'photo') {
    const p = it.photo;
    spec = { kind: 'photo', side, photo: p.id, cat: p.cat, mirror: it.mirror, rot: it.rot, view: p.view || 'other', rollB: rollBucket((it.rot * Math.PI) / 180) };
    drawPhoto(buf, await loadImg(p), it.mirror, it.rot);
  } else {
    spec = { kind: '3d', side, model: lv.model, style: lv.style, dir: it.dir, roll: it.roll, rot: it.rot, view: viewOf(it.dir, side), rollB: rollBucket(it.roll) };
    render3D(spec, buf, 1024);
  }
  SES.specs[i] = spec;
}
function clearStage() { const st = $('#stage'); if (st) st.getContext('2d').clearRect(0, 0, st.width, st.height); }
function nextTrial() {
  if (!SES.on || SES.phase !== 'go') return;
  const n = SES.plan.length;
  if (SES.i >= n) return showPhase('done');
  $('#prog').style.width = (SES.i / n) * 100 + '%';
  $('#progTxt').textContent = t('x_of_y', { n: SES.i + 1, m: n });
  clearStage(); $('#fix').hidden = false; SES.hidden = false;
  const i = SES.i, t0 = performance.now();
  // Render during the pause, never while she is answering.
  Promise.resolve(prepare(i)).then(() => {
    SES.t1 = setTimeout(() => {
      requestAnimationFrame(() => {
        if (!SES.on || SES.phase !== 'go' || SES.i !== i || !$('#stage')) return;
        const st = $('#stage'), ctx = st.getContext('2d');
        ctx.clearRect(0, 0, st.width, st.height);
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(SES.bufs[i % 2], 0, 0, st.width, st.height);
        $('#fix').hidden = true;
        requestAnimationFrame(() => { // the frame the picture is actually on screen
          if (!SES.on || SES.phase !== 'go' || SES.i !== i) return;
          SES.shownAt = performance.now(); SES.accepting = true;
          if (SES.cfg.speed > 0) SES.t2 = setTimeout(() => { if (SES.i === i && SES.accepting) { clearStage(); SES.hidden = true; } }, SES.cfg.speed);
        });
      });
    }, Math.max(0, 450 - (performance.now() - t0)));
  });
}
function answer(resp, ts) {
  if (!SES.on || !SES.accepting) return;
  // event.timeStamp is when the tap happened, unaffected by main-thread delays
  const at = ts && ts > SES.shownAt && ts <= performance.now() + 5 ? ts : performance.now();
  SES.accepting = false; clearTimeout(SES.t2);
  const sp = SES.specs[SES.i];
  const ok = resp === sp.side;
  SES.trials.push({ side: sp.side, resp, ok, rt: Math.round(at - SES.shownAt), view: sp.view, rollB: sp.rollB, rot: sp.rot, pair: SES.plan[SES.i].pair, src: sp.kind === 'photo' ? 'photo:' + sp.cat : SES.level.id, hid: SES.hidden });
  SES.i++;
  if (SES.cfg.feedback) {
    const fb = $('#fb'); fb.textContent = ok ? '✓ ' + t('ok_fb') : '× ' + t('no_fb'); fb.className = 'fb ' + (ok ? 'ok' : 'no'); fb.hidden = false;
    setTimeout(() => { if (fb.isConnected) fb.hidden = true; nextTrial(); }, 420);
  } else nextTrial();
}
function stopRound() {
  if (!SES.on) return;
  clearTimeout(SES.t1); clearTimeout(SES.t2); SES.accepting = false;
  if (!SES.trials.length) return closeSession();
  SES.stopped = true; showPhase('done');
}
function donePhase() {
  clearTimeout(SES.t1); clearTimeout(SES.t2); SES.accepting = false;
  const prev = sessionsAtStep(stepKey(SES.level.id, SES.cfg.angles)).slice(-1)[0];
  if (!SES.rec) {
    SES.rec = { id: uid(), start: SES.start, end: Date.now(), level: SES.level.id, cfg: SES.cfg, stopped: SES.stopped, trials: SES.trials };
    upsert('sessions', SES.rec);
  }
  const rec = SES.rec, n = rec.trials.length;
  $('#ses').innerHTML = `${head('done', '')}<div class="body">
    <div><h1>${esc(t('done_h'))}</h1><p class="muted">${esc(SES.stopped ? t('done_stopped', { n }) : t('done_full', { n }))}</p></div>
    <section class="panel"><h2>${esc(t('speed_h'))}</h2>${compareHtml(rec.trials, prev && prev.id !== rec.id ? prev.trials : null)}</section>
    <section class="panel">${todayHtml()}${(() => { const adv = advice(); return adv ? adviceHtml(adv) : ''; })()}</section>
  </div><div class="foot"><button type="button" class="btn primary big" data-act="endClose">${esc(t('finish'))}</button><button type="button" class="btn" data-act="again">${esc(t('again'))}</button></div>`;
}
function closeSession() {
  SES.on = false; SES.phase = null; clearTimeout(SES.t1); clearTimeout(SES.t2); SES.accepting = false;
  try { SES.lock?.release(); } catch (e) { /* ignore */ }
  $('#ses').hidden = true; $('#ses').innerHTML = ''; document.body.style.overflow = '';
  refresh();
}

/* ============================================================== backup */
function backupJson() { return JSON.stringify({ app: 'links-of-rechts', v: 2, settings: S, sessions: state.sessions }); }
function backupCsv() {
  const rows = [['round', 'start', 'level', 'picture', 'side', 'answer', 'correct', 'rt_ms', 'view', 'rotation_deg', 'pair', 'source', 'hidden']];
  for (const s of state.sessions.slice().sort((a, b) => a.start - b.start)) s.trials.forEach((x, i) => rows.push([s.id, new Date(s.start).toISOString(), s.level, i + 1, x.side, x.resp, x.ok ? 1 : 0, x.rt, x.view, x.rot ?? '', x.pair ?? '', x.src, x.hid ? 1 : 0]));
  return rows.map((r) => r.join(',')).join('\n');
}
function saveFile() {
  try {
    const url = URL.createObjectURL(new Blob([backupJson()], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = 'links-of-rechts-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (e) { copyText(backupJson()); }
}
function importBackup(text) {
  try {
    const d = JSON.parse(text);
    if (d.app !== 'links-of-rechts' || !Array.isArray(d.sessions)) throw new Error('bad');
    for (const s of d.sessions) if (s && s.id && Array.isArray(s.trials)) upsert('sessions', s);
    toast(t('imported', { n: d.sessions.length })); refresh();
  } catch (err) { toast(t('import_bad')); }
}
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); toast(t('copied')); }
  catch (e) { const ta = $('#bk'); if (ta) { ta.value = txt; ta.focus(); ta.select(); } toast(t('copy_fail')); }
}

/* ============================================================== events */
document.addEventListener('click', (e) => {
  const nb = e.target.closest('[data-tab]');
  if (nb) { tab = nb.dataset.tab; refresh(); window.scrollTo(0, 0); return; }
  const ob = e.target.closest('[data-ob]');
  if (ob) {
    const a = ob.dataset.ob;
    if (a === 'next') { OB.step = Math.min(2, OB.step + 1); renderOb(); }
    else if (a === 'back') { OB.step = Math.max(0, OB.step - 1); renderOb(); }
    else if (a === 'close') closeOnboarding();
    else if (a === 'start') { closeOnboarding(); startSession(); }
    return;
  }
  const lvb = e.target.closest('[data-level]');
  if (lvb) { S.level = lvb.dataset.level; S.angles = 'easy'; S.snooze = null; saveS(); refresh(); return; }
  const setb = e.target.closest('[data-set]');
  if (setb) {
    const k = setb.dataset.set; let v = setb.dataset.val;
    if (k === 'speed') v = +v;
    if (k === 'tone' && v !== S.tone) { S.tone = v; clearToneCache(); }
    S[k] = v; saveS();
    if (!$('#ob').hidden) renderOb(); else refresh();
    return;
  }
  const tg = e.target.closest('[data-toggle]');
  if (tg) {
    const k = tg.dataset.toggle;
    if (k === 'mirrorPrev') photoMirrorPreview = !photoMirrorPreview; else { S[k] = !S[k]; saveS(); }
    refresh(); return;
  }
  const ph = e.target.closest('[data-photo]');
  if (ph) { openPhotoSheet(ph.dataset.photo); return; }
  const ps = e.target.closest('[data-pset]');
  if (ps) { const p = state.photos.find((x) => x.id === $('#sheet').dataset.id); if (p) { p.side = ps.dataset.val; upsert('photos', p); PREV.clear(); openPhotoSheet(p.id); } return; }
  if (e.target.id === 'sheet') { $('#sheet').hidden = true; refresh(); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  if (act === 'start') startSession();
  else if (act === 'goStep') {
    const to = LADDER[+a.dataset.to]; if (!to) return;
    S.level = to.level; S.angles = to.angles; S.snooze = null; saveS();
    if (SES.on) closeSession(); else refresh();
    window.scrollTo(0, 0); toast(t('moved', { name: stepName(to.level, to.angles) }));
  }
  else if (act === 'snooze') { S.snooze = { key: stepKey(S.level, S.angles), at: Date.now() }; saveS(); if (SES.on) a.closest('.note').remove(); else refresh(); }
  else if (act === 'install') { doInstall().then(() => { if (!$('#ob').hidden && !$('#obL')) { $('#ob').hidden = true; document.body.style.overflow = ''; if (!S.onboarded) openOnboarding(); else refresh(); } }); }
  else if (act === 'instHow') openInstallHelp();
  else if (act === 'instClose') { $('#ob').hidden = true; $('#ob').innerHTML = ''; document.body.style.overflow = ''; if (!S.onboarded) openOnboarding(); else refresh(); }
  else if (act === 'cnt') { S.count = clamp(S.count + +a.dataset.d, 6, 60); saveS(); refresh(); }
  else if (act === 'sesClose') closeSession();
  else if (act === 'begin') showPhase('go');
  else if (act === 'stop') stopRound();
  else if (act === 'again') { closeSession(); startSession(); }
  else if (act === 'endClose') { closeSession(); toast(t('saved')); }
  else if (act === 'copyJson') copyText(backupJson());
  else if (act === 'saveFile') saveFile();
  else if (act === 'copyCsv') copyText(backupCsv());
  else if (act === 'import') importBackup($('#bk').value);
  else if (act === 'phClose') { $('#sheet').hidden = true; refresh(); }
  else if (act === 'phDel') {
    const id = $('#sheet').dataset.id, k = 'p' + id;
    if (confirmKey === k) { confirmKey = null; remove('photos', id); imgCache.delete(id); PREV.clear(); $('#sheet').hidden = true; refresh(); }
    else { armConfirm(k); openPhotoSheet(id); }
  }
  else if (act === 'reshow') openOnboarding();
  else if (act === 'wipe') { if (confirmKey === 'wipe') { confirmKey = null; wipeAll(); imgCache.clear(); PREV.clear(); toast(t('wiped')); } else armConfirm('wipe'); refresh(); }
});
document.addEventListener('toggle', (e) => { if (e.target.id === 'adjust') adjustOpen = e.target.open; }, true);
document.addEventListener('change', async (e) => {
  const id = e.target.id;
  if (id === 'progStep') { S.progStep = e.target.value; saveS(); refresh(); }
  else if (id === 'bkFile') { const f = e.target.files && e.target.files[0]; if (f) importBackup(await f.text()); }
  else if (id === 'upCat') { S.upCat = e.target.value; saveS(); refresh(); }
  else if (id === 'peCat' || id === 'peView') { const p = state.photos.find((x) => x.id === $('#sheet').dataset.id); if (p) { p[id === 'peCat' ? 'cat' : 'view'] = e.target.value; upsert('photos', p); } }
  else if (id === 'upFile') {
    const files = Array.from(e.target.files || []); if (!files.length) return;
    const cat = $('#upCat').value, view = $('#upView').value, side = S.upSide || 'R';
    let n = 0;
    for (let i = 0; i < files.length; i++) {
      const st = $('#upStatus'); if (st) st.textContent = t('ph_busy', { i: i + 1, n: files.length });
      try { const data = await processFile(files[i]); upsert('photos', { id: uid(), added: Date.now() + i, data, side, cat, view }); n++; } catch (err) { /* skip unreadable file */ }
    }
    PREV.clear(); refresh(); const st2 = $('#upStatus'); if (st2) st2.textContent = t('ph_done', { n });
  }
});
document.addEventListener('keydown', (e) => {
  if (!SES.on || SES.phase !== 'go') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); answer('L', e.timeStamp); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); answer('R', e.timeStamp); }
  else if (e.key === 'Escape') stopRound();
});
window.addEventListener('resize', () => { if (SES.on && SES.phase === 'go' && SES.fit && $('#stage')) SES.fit(); if (tab === 'progress' && !SES.on) drawCharts(); });
const onTheme = () => { PREV.clear(); if (!SES.on && $('#ob').hidden) refresh(); };
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme); } catch (e) { /* old browser */ }
new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ================================================================ boot */
(async function boot() {
  renderNav();
  await dbOpen();
  // ask the browser to keep this data instead of clearing it when space runs low
  try { DB.persisted = !!(navigator.storage && navigator.storage.persist && (await navigator.storage.persist())); } catch (e) { DB.persisted = false; }
  if (DB.ok) {
    const [a, b] = await Promise.all([dbAll('sessions'), dbAll('photos')]);
    state.sessions = a || []; state.photos = b || [];
  }
  // merge in the second copy, in case one of the two was cleared
  try {
    const f = JSON.parse(localStorage.getItem('lrt.fallback') || '{}');
    const have = new Set(state.sessions.map((s) => s.id));
    for (const s of f.sessions || []) if (s && s.id && Array.isArray(s.trials) && !have.has(s.id)) { state.sessions.push(s); persist('sessions', s); }
    DB.ls = true;
  } catch (e) { DB.ls = false; }
  lsSave();
  refresh();
  if (ENV.can && ENV.ios && !S.installSeen) { S.installSeen = true; saveS(); openInstallHelp(); }
  else if (!S.onboarded) openOnboarding();
})();
window.__lrt = { state, S, SES, advice, stepCheck, LADDER }; // used by automated tests only
})();

</script>
